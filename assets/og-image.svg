<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A4585"/>
      <stop offset="100%" stop-color="#103260"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Decorative accent line -->
  <rect x="80" y="290" width="48" height="2" fill="#c9a66b"/>

  <!-- Eyebrow -->
  <text x="80" y="270"
        font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif"
        font-size="18"
        font-weight="500"
        letter-spacing="3.6"
        fill="#c9a66b">ZAHNARZTPRAXIS · SEELAND · ARCH BE</text>

  <!-- Main title -->
  <text x="80" y="380"
        font-family="Georgia, 'DejaVu Serif', 'Liberation Serif', 'Times New Roman', serif"
        font-size="84"
        font-weight="400"
        letter-spacing="-1.5"
        fill="#ffffff">Zahnärztehaus Arch</text>

  <!-- Subtitle -->
  <text x="80" y="445"
        font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif"
        font-size="32"
        font-weight="400"
        fill="#ffffff"
        opacity="0.92">Zahnmedizin mit Zeit.</text>

  <!-- Bottom info bar -->
  <line x1="80" y1="525" x2="1120" y2="525" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="80" y="565"
        font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif"
        font-size="20"
        fill="#ffffff"
        opacity="0.75">Bürenstrasse 13, 3296 Arch</text>
  <text x="1120" y="565"
        font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif"
        font-size="20"
        fill="#ffffff"
        opacity="0.75"
        text-anchor="end">Dr. med. dent. Daniela Tamas-Hess</text>

  <!-- Tooth icon top right -->
  <g transform="translate(1020, 110)" opacity="0.18">
    <path d="M60 0c-8 0-12 4-16 4S36 0 28 0c-8 0-12 8-12 20 0 16 8 32 12 48 4 12 12 12 16 0l4-12c1.2-4 6.8-4 8 0l4 12c4 12 12 12 16 0 4-16 12-32 12-48 0-12-4-20-12-20-8 0-12 4-16 4z"
          fill="none"
          stroke="#ffffff"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
